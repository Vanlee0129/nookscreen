name: 机型适配 / Device support
description: 装不上、按主页键回不到 NookScreen、开机或待机后回到原桌面、信号源不对 / Installing fails, Home or boot lands on the old launcher, inputs are wrong
title: "[机型] "
body:
  - type: markdown
    attributes:
      value: |
        维护者只有小米 MiTV-MFTR0 和 TCL MT5879 两台电视，别的品牌全靠你贴的诊断信息。
        The maintainer has only two TVs (Xiaomi MiTV-MFTR0, TCL MT5879); other brands depend on the diagnostics you paste.

        **最省事：交给 AI Agent / Easiest: hand it to an AI agent.** 对电脑版 Agent（Claude Code、Codex、Trae、WorkBuddy 等）说：
        请从手机配置页复制诊断信息，附在报告中。
        Copy the diagnostics from the phone setup page and include them in your report.

  - type: input
    id: model
    attributes:
      label: 品牌和型号 / Brand and model
      description: 包装或设置里「关于」写的型号，比如 Redmi X65 2026、TCL 75Q10L / As on the box or in About
      placeholder: Redmi X65 2026
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NookScreen 版本 / NookScreen version
      description: 控制中心最下面右边写的版本；装不上就写下载的文件名 / Bottom right of Control Center, or the APK you tried
      placeholder: NookScreen 1.31-guard
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么 / What happens
      description: 怎么操作、看到什么、本来应该怎样。能截图或拍照更好 / What you did, what you saw, what you expected. Photos help.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 怎么装的 / How NookScreen was installed
      options:
        - 一行命令 install.sh / The install command
        - 交给 Agent / An AI agent
        - Windows 逐条运行 / Step by step on Windows
        - U 盘、当贝或其他 / USB drive, Dangbei or other
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: 信号源修正（可选）/ Input corrections (optional)
      description: Agent 在电视上试好的 device profile JSON（没有就留空），从手机页提交时会自动填上 / The device profile JSON an agent tried on the TV (leave empty if none); filled in when posted from the phone page
      render: json
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息 / Diagnostics
      description: 把 report.sh（和 selftest.sh）的输出、手机页复制的内容，或 Agent 整理的报告整段贴进来 / Paste all of report.sh's (and selftest.sh's) output, what the phone page copied, or the agent's report
      render: markdown
    validations:
      required: true
